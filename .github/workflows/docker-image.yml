name: Docker Image CI

on:
  [push]
    # branches: [ "*" ]
  # pull_request:
  #   branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build -t kedro-app:test .
    - name: Run find inside Docker container
      run: docker run --rm kedro-app:test find . -maxdepth 5 -type f
    - name: Run Kedro tests inside Docker container
      run: docker run --rm kedro-app:test uv run pytest
